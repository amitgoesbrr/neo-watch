# Neo-Watch Full Stack Docker Compose
# Run: docker-compose up -d

services:
  # {{{ PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: neo-watch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neo_user
      POSTGRES_PASSWORD: neo_password
      POSTGRES_DB: neo_watch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo_user -d neo_watch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo-network
  # }}}

  # {{{ Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: neo-watch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo-network
  # }}}

  # {{{ Backend API
  backend:
    build:
      context: ./neo-watch-backend
      dockerfile: Dockerfile
    container_name: neo-watch-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://neo_user:neo_password@postgres:5432/neo_watch
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neo-network
  # }}}

  # {{{ Frontend Application
  frontend:
    build:
      context: ./neo-watch
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: neo-watch-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - neo-network
  # }}}

# {{{ Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
# }}}

# {{{ Networks
networks:
  neo-network:
    driver: bridge
# }}}
